plugins { id 'com.android.application' }

android {
    namespace 'com.mailcrusher'
    compileSdk 35

    signingConfigs {
        release {
            storeFile file(System.getenv('MC_KEYSTORE_PATH') ?: 'release-keystore.jks')
            storePassword System.getenv('MC_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('MC_KEY_ALIAS') ?: ''
            keyPassword System.getenv('MC_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    defaultConfig {
        applicationId 'com.mailcrusher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
